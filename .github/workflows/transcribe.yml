name: 音频转文字
run-name: 转录 · ${{ inputs.job_tag }}
on:
  workflow_dispatch:
    inputs:
      job_tag:
        description: 由 cloud_job.py 返回的音频任务 ID
        required: true
        type: string
permissions:
  contents: write
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      JOB_TAG: ${{ inputs.job_tag }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 接收音频
        run: python scripts/github_runner.py prepare
      - name: 安装转录环境
        run: bash scripts/setup.sh
      - name: 转录（默认完整音频）
        run: .venv/bin/python scripts/github_runner.py transcribe
      - name: 保存结果（60 天后自动过期）
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-${{ inputs.job_tag }}
          path: |
            outputs/**/*.txt
            outputs/**/*.srt
            outputs/**/run-report.json
          if-no-files-found: error
          retention-days: 60
      - name: 返回结果链接
        env:
          RESULT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          printf '## 转录完成\n\n[下载 TXT、SRT 和运行报告](%s)\n\n结果保留 60 天。\n' "$RESULT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: 清理临时音频传输
        if: always()
        run: python scripts/github_runner.py cleanup
