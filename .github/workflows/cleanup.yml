name: 清理遗留音频传输
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 永久删除超过 7 天的本工具临时输入
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_runner.py cleanup-old
